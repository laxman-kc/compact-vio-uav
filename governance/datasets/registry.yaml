# EuRoC is selected for the accepted training-first development prototype.
# Every other entry remains a candidate. Exact EuRoC archives, checksums,
# modalities, sequence-disjoint development membership, and the separately
# frozen Machine Hall position endpoint are recorded in the linked plans rather
# than duplicated here.
datasets:
  - id: tartanair-v2
    name: TartanAir V2
    decision_status: candidate
    project_role: unresolved
    official_url: https://tartanair.org/
    rights:
      status: recorded_from_official_source
      label: CC BY 4.0
      url: https://tartanair.org/
    cautions:
      - Synthetic data does not establish real-sensor timing, calibration, or noise robustness.
      - Environment, trajectory, modality, and render variants require source grouping.

  - id: euroc-mav
