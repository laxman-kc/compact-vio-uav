      url: https://www.research-collection.ethz.ch/entities/researchdata/bcaf173e-5dac-484b-bc37-faf97a594f1f
    cautions:
      - Selection is for non-commercial open research and does not imply redistribution rights.
      - The checked-in split is a development prototype split, not a publication confirmatory protocol.
      - Physical sequences, not derived frame pairs, are the split and evaluation units.

