    cautions:
      - The room4 512x512 unit remains a non-executable scientific candidate; the separate one-use operational transfer authorization does not select or approve it for dataset use.
      - The one-use transfer retained publisher-size/MD5-verified bytes and computed SHA-256, then strict TAR inventory rejected an official DSO-tree symbolic link; the authorization is consumed and no success receipt exists.
      - The completed header-only audit recorded 4,472 regular files, 11 directories, and two inert DSO-tree symlinks without following or extracting them; strict extraction compatibility is false and scientific authority is none.
      - The audit-bound one-use operation copied exactly the eight allowlisted regular mav0 files, totaling 5,043,300 bytes, after its authorization revision passed CI; it excluded dso, followed no link, and is consumed with a tracked receipt.
      - The compatibility-slice name denotes an operational input boundary, not a compatibility result. Its later bounded format inspection parsed only CSV structure and exactly four PNG signature/IHDR records; it completed with does_not_conform because the observed eight-column mocap header does not match either current 17-column EuRoC full-state target and the first selected camera timestamp falls before both observed IMU and mocap ranges.
      - The format receipt does not establish units, frames, synchronization correction, calibration, ground-truth meaning, whole-file PNG validity/decodability, full image existence, scientific selection, or source membership. The EuRoC adapter must not be reused. At that point, the receipt identified a TUM-VI-specific adapter contract and, only if justified, separately authorized minimal calibration metadata as future gates before any model work.
      - The pushed and CI-green adapter contract is a strict grammar and source-labelled output-policy record, not a payload parser or adapter. Its interval comparisons order integer timestamp tokens without asserting a common clock; segment, pose-association, decoding, preprocessing, and all readiness decisions remain blocked. It reads no real payload, calibration, image, learning, or model path and grants no scientific authority.
      - Gate 2 is implemented, pushed, and CI-green as an exact synthetic BytesIO parser boundary. It opened no real data, denies the known inspected real CSV hashes before reading, and adds no filesystem loader, CLI, package-level data export, calibration/image/EuRoC/learning/model dependency, or segment constructor.
      - Gate 2 assigns a fixed synthetic-only source_scope label to caller-supplied bytes; the label does not authenticate external origin. Size/SHA verification proves identity of supplied bytes but not where they came from; successful parsing grants no real-payload, adapter, dataset, or scientific authority.
      - Gate 3B now has a locally frozen, independently reviewed inert specification and future-authorization controller for an exact four-file aggregate real-CSV grammar probe. The implementation is uncommitted and has no CI result. It opened, read, and hashed no real payload; no authorization, claim, receipt, or grammar result exists.
      - Gate 3B execution remains prohibited until the exact implementation is committed, pushed, and CI-green and a later exact one-use authorization is separately reviewed, committed, pushed, and CI-green. That controller must publish a durable claim before its first payload descriptor open. It persists or emits no source row contents or lexemes; source-derived observations are aggregate counts, check states, and first-violation location, while a receipt also binds frozen source identity/path and execution/capacity metadata. Grammar acceptance or rejection would grant no readiness or scientific authority. Calibration-metadata access remains a separate unselected design question.
      - The motion/domain is not a substitute for UAV-domain evidence.
      - Ground-truth availability varies and must be recorded per sequence.
