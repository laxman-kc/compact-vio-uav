[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "compact-vio-uav"
version = "0.1.0.dev0"
description = "Evidence-gated research infrastructure for compact UAV visual-inertial odometry"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "compact-vio-uav contributors" }]
dependencies = []

[project.optional-dependencies]
data = [
  "Pillow>=10.4,<13",
  "PyYAML>=6.0.2,<7",
]
governance = [
  "jsonschema[format-nongpl]==4.26.0",
]
train = [
  "Pillow>=10.4,<13",
  "PyYAML>=6.0.2,<7",
  "torch>=2.7,<3",
]

[project.scripts]
compact-vio-artifacts = "compact_vio.artifacts:main"
compact-vio-copy-audit = "compact_vio.copy_audit:main"
compact-vio-validate-governed-bundle = "compact_vio.governed_bundle:main"
compact-vio-preflight = "compact_vio.preflight:main"
compact-vio-repo-check = "compact_vio.repository_policy:main"
compact-vio-euroc = "compact_vio.data.acquire:main"
compact-vio-acquire-archive = "compact_vio.data.acquisition:main"
compact-vio-audit-archive-structure = "compact_vio.data.archive_audit:main"
compact-vio-extract-regular-slice = "compact_vio.data.archive_slice:main"
compact-vio-inspect-tumvi-format = "compact_vio.data.tumvi_format_inspection:main"
compact-vio-train = "compact_vio.learning.cli:main"
compact-vio-evaluate-position = "compact_vio.learning.position_evaluate_cli:main"
compact-vio-export-inference = "compact_vio.learning.inference_export_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
