<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">TUM-VI Gate 3B aggregate grammar result by source</title>
  <desc id="description">Categorical status comparison for four receipt-bound CSV sources. Camera zero, camera one, and IMU accepted the frozen Gate 1 grammar. Pose rejected at exact header mismatch on physical line one. The completed aggregate receipt grants no readiness or scientific authority.</desc>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .title { font-size: 27px; font-weight: 700; fill: #172033; }
    .subtitle { font-size: 14px; fill: #526075; }
    .header { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #68758a; }
    .label { font-size: 16px; font-weight: 650; fill: #263248; }
    .detail { font-size: 12px; fill: #68758a; }
    .status { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; }
    .accepted { fill: #1d4ed8; }
    .rejected { fill: #64748b; }
    .note { font-size: 13px; fill: #526075; }
  </style>

  <rect width="1200" height="640" fill="#ffffff"/>
  <text class="sans title" x="42" y="48">TUM-VI Gate 3B aggregate grammar result by source</text>
  <text class="sans subtitle" x="42" y="76">Categorical status bands • exact receipt-bound bytes • completed / rejects_frozen_gate1_grammar</text>

  <rect x="922" y="28" width="104" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="mono accepted" x="974" y="52" text-anchor="middle" font-size="20" font-weight="700">3</text>
  <text class="sans accepted" x="974" y="71" text-anchor="middle" font-size="11" font-weight="700">ACCEPTED</text>
  <rect x="1038" y="28" width="120" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="mono rejected" x="1098" y="52" text-anchor="middle" font-size="20" font-weight="700">1</text>
  <text class="sans rejected" x="1098" y="71" text-anchor="middle" font-size="11" font-weight="700">REJECTED</text>

  <text class="sans header" x="42" y="126">SOURCE / DENOMINATOR</text>
  <text class="sans header" x="350" y="126">FROZEN GATE 1 GRAMMAR STATUS</text>
  <text class="sans header" x="1020" y="126">STATE</text>
  <line x1="42" y1="136" x2="1158" y2="136" stroke="#dbe3ee"/>

  <g aria-label="Camera zero accepted 2228 of 2228 data rows">
    <text class="sans label" x="42" y="177">cam0 camera index</text>
    <text class="mono detail" x="42" y="197">2,228 / 2,228 validated</text>
    <rect x="350" y="153" width="635" height="48" rx="6" fill="#2563eb" stroke="#1d4ed8"/>
    <text class="sans" x="370" y="181" fill="#ffffff" font-size="13" font-weight="700">ALL CHECKS PASS • RAW STEREO LOCKSTEP PASS</text>
    <text class="sans status accepted" x="1020" y="181">ACCEPTED</text>
  </g>

  <g aria-label="Camera one accepted 2228 of 2228 data rows">
    <text class="sans label" x="42" y="255">cam1 camera index</text>
    <text class="mono detail" x="42" y="275">2,228 / 2,228 validated</text>
    <rect x="350" y="231" width="635" height="48" rx="6" fill="#2563eb" stroke="#1d4ed8"/>
    <text class="sans" x="370" y="259" fill="#ffffff" font-size="13" font-weight="700">ALL CHECKS PASS • RAW STEREO LOCKSTEP PASS</text>
    <text class="sans status accepted" x="1020" y="259">ACCEPTED</text>
  </g>

  <g aria-label="IMU accepted 22212 of 22212 data rows">
    <text class="sans label" x="42" y="333">IMU</text>
    <text class="mono detail" x="42" y="353">22,212 / 22,212 validated</text>
    <rect x="350" y="309" width="635" height="48" rx="6" fill="#2563eb" stroke="#1d4ed8"/>
    <text class="sans" x="370" y="337" fill="#ffffff" font-size="13" font-weight="700">ALL DECLARED CHECKS PASS</text>
    <text class="sans status accepted" x="1020" y="337">ACCEPTED</text>
  </g>

  <g aria-label="Pose rejected at exact header mismatch on physical line one with zero of 13075 data rows validated">
    <text class="sans label" x="42" y="411">pose</text>
    <text class="mono detail" x="42" y="431">0 / 13,075 validated</text>
    <rect x="350" y="387" width="635" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
    <text class="sans rejected" x="370" y="415" font-size="13" font-weight="700">EXACT HEADER MISMATCH • PHYSICAL LINE 1</text>
    <text class="sans status rejected" x="1020" y="415">REJECTED</text>
  </g>

  <rect x="42" y="474" width="1116" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="sans" x="62" y="498" fill="#263248" font-size="14" font-weight="700">Receipt totals</text>
  <text class="mono" x="62" y="519" fill="#526075" font-size="12">3,909,654 bytes • 39,747 physical lines • 39,743 data lines • 26,668 validated rows • checks 27 pass / 1 fail / 6 not reached</text>

  <line x1="42" y1="562" x2="1158" y2="562" stroke="#dbe3ee"/>
  <rect x="42" y="582" width="18" height="12" rx="2" fill="#2563eb"/>
  <text class="sans note" x="70" y="593">Blue filled: grammar accepted</text>
  <rect x="278" y="582" width="18" height="12" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="sans note" x="306" y="593">Open neutral: grammar rejected</text>
  <text class="sans note" x="1158" y="593" text-anchor="end">Engineering observation only — 14/14 readiness false • authority none</text>
  <text class="mono" x="42" y="620" fill="#7b879a" font-size="10">source: receipt 7ea8720fc013504de8db22396a5eb4d8bf8f25f33cd00ab2e6798bd42d42c958 • execution 47daabc1891b71e53a6d3f4f5a070d69bbbe5c78</text>
</svg>
